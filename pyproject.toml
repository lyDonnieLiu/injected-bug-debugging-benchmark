[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "injected-bug-debugging-benchmark"
version = "0.1.0"
description = "Injected bugs as ground truth: a benchmark and credibility reports for model debugging with mechanistic interpretability."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "einops>=0.8",
    "jaxtyping>=0.2.28",
    "matplotlib>=3.8",
    "nltk>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "peft>=0.13",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "sae-lens>=5.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformer-lens>=3.3",
    "transformers>=4.46",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "common",
    "inject_bugs",
    "ground_truth",
    "evaluate",
    "credibility_report",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]